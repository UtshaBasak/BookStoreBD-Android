title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping shape BookStoreBD for Android. Share a new feature,
        an upgrade, or a better way to do something the app already does.

        Before posting, have a look at the [roadmap](https://github.com/UtshaBasak/BookStoreBD-Android#coming-soon)
        and the ideas already shared. If yours is there, upvote it and add your
        thoughts, so the most wanted ideas rise to the top.

        Ideas for the website are welcome in the
        [website's Ideas](https://github.com/UtshaBasak/BookStoreBD/discussions/categories/ideas).
  - type: dropdown
    id: kind
    attributes:
      label: What kind of idea is it?
      options:
        - A new feature
        - An upgrade to an existing feature
        - A better way to do something (easier, faster or clearer)
    validations:
      required: true
  - type: checkboxes
    id: who
    attributes:
      label: Who would it help?
      options:
        - label: Buyers
        - label: Sellers
        - label: Everyone using the app
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should the app do, or do differently?
      placeholder: Let me scan a book's ISBN barcode to find it in the shop.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What is missing, slow or confusing today, and how this would make it better.
      placeholder: Typing a long Bangla title on a phone keyboard takes a while.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: An example (optional)
      description: A situation where it would help, a sketch, or a screenshot of the screen it is about.
